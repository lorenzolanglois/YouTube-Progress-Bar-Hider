<!DOCTYPE html>

<html>
    <head>
        <script src="popup.js"></script>
    </head>

    <body style="background: #171717; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 210px; justify-content: center;">
        <div id="notYoutube" style="display: none; background-color: #171717cc; height: 100%; width: 100%; position: absolute; z-index: 999; align-items: center;">
            <p style="color: #f1f1f1; font-family: Roboto, Arial, sans-serif; font-size: 20px; text-align: center; padding: 20px;">This extension only works on YouTube</p>
        </div>
        <div id="test" style="width: 100%; height: 10px; background-color: #F1F1F1; position: relative; z-index: 100; border-radius: 12px; display: flex; align-items: center;">
            <div style="width: 40%; height: 100%; background-color: #F52027; border-radius: 12px; position: absolute;"></div>
            <div style="border-radius: 100%; width: 15px; height: 15px; background-color: #F52027; position: absolute; left: 35%;"></div>
        </div>
        <button id="toggleButton" style="z-index: 900; background-color: #333333; border-radius: 20px; color: #f1f1f1; border: none; font-family: Roboto, Arial, sans-serif; padding: 16px; width: 100%; cursor: pointer; position: relative;">Toggle YouTube Progress Bar</button>
    </body>
</html>
